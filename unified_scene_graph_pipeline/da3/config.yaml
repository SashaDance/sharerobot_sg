Weights:
  DA3: '/models/da3/model.safetensors'
  DA3_CONFIG: '/models/da3/config.json'
  SALAD: '/models/da3/unused-dino-salad.ckpt'

Model:
  chunk_size: 30
  overlap: 5
  loop_chunk_size: 20
  loop_enable: false
  useDBoW: false
  delete_temp_files: true
  align_lib: 'torch'
  align_method: 'sim3'
  scale_compute_method: 'auto'
  align_type: 'dense'
  ref_view_strategy: 'saddle_balanced'
  ref_view_strategy_loop: 'saddle_balanced'
  process_res: 504
  process_res_method: 'upper_bound_resize'
  depth_threshold: 15.0
  save_depth_conf_result: true
  save_debug_info: false
  Sparse_Align:
    keypoint_select: 'orb'
    keypoint_num: 5000
  IRLS:
    delta: 0.1
    max_iters: 5
    tol: 1e-9
  Pointcloud_Save:
    sample_ratio: 0.015
    conf_threshold_coef: 0.75

Loop:
  SALAD:
    image_size: [336, 336]
    batch_size: 32
    similarity_threshold: 0.85
    top_k: 5
    use_nms: true
    nms_threshold: 25
  SIM3_Optimizer:
    lang_version: 'python'
    max_iterations: 30
    lambda_init: 1e-6
