name: ${COMPOSE_PROJECT_NAME:-unified-sgg}

services:
  qwen:
    image: vllm/vllm-openai:v0.24.0
    command:
      - --model
      - /models/qwen3.8-27b
      - --served-model-name
      - Qwen/Qwen3.8-27B
      - --dtype
      - bfloat16
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - "${QWEN_GPU_MEMORY_UTILIZATION:-0.92}"
      - --limit-mm-per-prompt
      - '{"image":30}'
      - --trust-remote-code
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${MODEL_ROOT:-/datasets/unified_scene_graph_models}:/models:ro
      - ./manifests:/manifests:ro
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QWEN_GPU_ID:-1}"]
              capabilities: [gpu]

  qwen-proxy:
    image: python:3.12-alpine
    command: ["python", "/proxy/auth_proxy.py"]
    environment:
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?set INFERENCE_API_KEY in the mode-600 runtime env file}
      UPSTREAM_HOST: qwen
      UPSTREAM_PORT: "8000"
    volumes:
      - ./auth_proxy.py:/proxy/auth_proxy.py:ro
    ports:
      - 127.0.0.1:${QWEN_HOST_PORT:-8008}:8080
    depends_on:
      - qwen
    restart: unless-stopped

  core:
    profiles: [tools]
    image: unified-sgg-core:1.0.0
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    environment:
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?set INFERENCE_API_KEY in the mode-600 runtime env file}
    volumes:
      - ${DATASET_ROOT:-/datasets}:/datasets:ro
      - ${RUN_ROOT:-/datasets/unified_scene_graph_runs}:/runs
      - ${MODEL_ROOT:-/datasets/unified_scene_graph_models}:/models:ro
      - ./manifests:/manifests:ro
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CORE_GPU_ID:-1}"]
              capabilities: [gpu]

  robotseg:
    profiles: [tools]
    image: unified-sgg-robotseg:1.0.0
    build:
      context: .
      dockerfile: docker/robotseg.Dockerfile
    volumes:
      - ${DATASET_ROOT:-/datasets}:/datasets:ro
      - ${RUN_ROOT:-/datasets/unified_scene_graph_runs}:/runs
      - ${MODEL_ROOT:-/datasets/unified_scene_graph_models}:/models:ro
      - ./manifests:/manifests:ro
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CORE_GPU_ID:-1}"]
              capabilities: [gpu]

  reviosa:
    profiles: [tools]
    image: woojeongjin/interrvos@sha256:6405558c773b1bdb3251dd6db65bbc975147e6533e9ab447782caac28c9eb8ac
    entrypoint: ["python", "/pipeline/reviosa_tracking_compare.py"]
    volumes:
      - ${DATASET_ROOT:-/datasets}:/datasets:ro
      - ${RUN_ROOT:-/datasets/unified_scene_graph_runs}:/runs
      - ${MODEL_ROOT:-/datasets/unified_scene_graph_models}:/models:ro
      - ./pipeline/reviosa_tracking_compare.py:/pipeline/reviosa_tracking_compare.py:ro
      - ./reviosa_tracking_config.json:/pipeline/reviosa_tracking_config.json:ro
      - ./manifests:/manifests:ro
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CORE_GPU_ID:-1}"]
              capabilities: [gpu]

  da3:
    profiles: [tools]
    image: unified-sgg-da3:1.0.0
    build:
      context: .
      dockerfile: docker/da3.Dockerfile
    volumes:
      - ${RUN_ROOT:-/datasets/unified_scene_graph_runs}:/runs
      - ${MODEL_ROOT:-/datasets/unified_scene_graph_models}:/models:ro
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DA3_GPU_ID:-1}"]
              capabilities: [gpu]
