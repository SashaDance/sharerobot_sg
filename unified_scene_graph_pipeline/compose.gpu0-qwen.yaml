services:
  qwen:
    command:
      - --model
      - /models/qwen3.8-27b
      - --served-model-name
      - Qwen/Qwen3.8-27B
      - --dtype
      - bfloat16
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - "0.85"
      - --limit-mm-per-prompt
      - '{"image":30}'
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
